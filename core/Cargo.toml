[package]
name = "inkline-core"
version = "0.1.0"
edition = "2021"
description = "Inkline core: inference orchestration, debounce, prompt building, FFI boundary"
license = "MIT"

[lib]
name = "inkline_core"
# cdylib for the dynamic library the native shells link against;
# staticlib kept available for future build setups that prefer static linking.
crate-type = ["cdylib", "staticlib"]

[dependencies]
# Blocking HTTP client for talking to the local llama-server (localhost only, no
# TLS needed). serde_json builds request bodies and parses responses.
ureq = { version = "2", default-features = false }
serde_json = "1"

[build-dependencies]
cbindgen = "0.29"
